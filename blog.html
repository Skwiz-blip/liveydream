<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog &amp; Ressources - Live Y Dream</title>
<meta name="description" content="Conseils et stratégies de communication pour les marques et PME d'Afrique de l'Ouest.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div data-lyd="header"></div>

<main>
  <div id="blog-content">
  <section class="dk phero">
    <div class="w">
      <span class="k">Blog &amp; Ressources</span>
      <h1>Conseils &amp; stratégies pour vos marques</h1>
      <p class="crumb"><a href="index.html">Accueil</a> / Blog</p>
    </div>
  </section>

  <section class="sec" style="padding:60px 0 90px">
    <div class="w">
      <div class="bar">
        <div class="filters" id="cats" style="margin:0"></div>
        <form class="search" id="sf"><input id="q" type="search" placeholder="Rechercher" aria-label="Rechercher un article"><button type="submit">OK</button></form>
      </div>
      <div id="feat"></div>
      <div class="bg" id="grid"></div>
      <div class="pager" id="pager"></div>
    </div>
  </section>

  <section class="gy tagsec">
    <div class="w">
      <h3>Catégories &amp; tags</h3>
      <div class="filters" id="cats2" style="margin:0"></div>
      <div class="tagcloud" id="tags"></div>
    </div>
  </section>
  </div>
  <section id="article-placeholder" style="display:none;min-height:55vh;place-items:center">
    <h1>...</h1>
  </section>
</main>

<div data-lyd="footer"></div>
<script src="js/cms.js"></script>
<script>
(function () {
  var e = CMS.esc, $ = function (id) { return document.getElementById(id); };
  var all = CMS.get('articles');
  var PER = 8;
  var st = { cat: '', tag: '', q: '', page: 1 };

  CMS.mount('blog.html');

  var initials = function (n) { return n.split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase(); };
  var meta = function (a, upper) { return e(a.cat) + ' · ' + e(a.date) + ' · ' + a.min + ' min'; };
  var articleUrl = function (a) { return 'blog.html?id=' + encodeURIComponent(a.id); };

  function filtered() {
    var q = st.q.toLowerCase();
    return all.filter(function (a) {
      return (!st.cat || a.cat === st.cat) &&
        (!st.tag || a.tags.indexOf(st.tag) > -1) &&
        (!q || (a.t + ' ' + a.ex + ' ' + a.tags.join(' ')).toLowerCase().indexOf(q) > -1);
    });
  }

  function footerRow(a) {
    return '<div class="au"><span><i class="av">' + e(initials(a.author)) + '</i>' + e(a.author) + '</span><a href="' + articleUrl(a) + '">Lire l\'article →</a></div>';
  }

  function cats() {
    var names = [];
    all.forEach(function (a) { if (names.indexOf(a.cat) < 0) names.push(a.cat); });
    var html = '<button class="chip' + (!st.cat ? ' on' : '') + '" data-cat="">Tous les articles</button>' +
      names.map(function (n) {
        var c = all.filter(function (a) { return a.cat === n; }).length;
        return '<button class="chip' + (st.cat === n ? ' on' : '') + '" data-cat="' + e(n) + '">' + e(n) + ' · ' + c + '</button>';
      }).join('');
    $('cats').innerHTML = html; $('cats2').innerHTML = html;
  }

  function tags() {
    var seen = {}, list = [];
    all.forEach(function (a) { a.tags.forEach(function (t) { if (!seen[t]) { seen[t] = 1; list.push(t); } }); });
    $('tags').innerHTML = list.map(function (t) {
      return '<button class="' + (st.tag === t ? 'on' : '') + '" data-tag="' + e(t) + '">' + e(t) + '</button>';
    }).join('');
  }

  function render() {
    cats(); tags();
    var list = filtered();
    var feat = list.filter(function (a) { return a.featured; })[0];
    var rest = list.filter(function (a) { return a !== feat; });
    var pages = Math.max(1, Math.ceil(rest.length / PER));
    if (st.page > pages) st.page = pages;

    $('feat').innerHTML = feat && st.page === 1 ?
      '<article class="feat"><div class="im ph-box">' + CMS.ph(feat.img, 'À la une', feat.t) + '</div><div>' +
      '<span class="pill">À LA UNE</span><p class="meta" style="display:inline;margin-left:10px">' + meta(feat) + '</p>' +
      '<h2>' + e(feat.t) + '</h2><p class="ex">' + e(feat.ex) + '</p>' + footerRow(feat) + '</div></article>' : '';

    var slice = rest.slice((st.page - 1) * PER, st.page * PER);
    $('grid').innerHTML = slice.length || feat ? slice.map(function (a) {
      return '<article class="ar"><div class="im ph-box">' + CMS.ph(a.img, a.cat, a.t) + '</div>' +
        '<p class="meta">' + meta(a) + '</p><h3><a href="' + articleUrl(a) + '">' + e(a.t) + '</a></h3><p class="ex">' + e(a.ex) + '</p>' + footerRow(a) + '</article>';
    }).join('') + (st.page === pages ? '<aside class="audit"><h3>Audit Gratuit</h3><p>Faites auditer votre communication par nos experts. Sans engagement, réponse en 24h.</p><a class="btn" href="contact.html?service=' + encodeURIComponent('Stratégie Digitale Complète') + '">Demander →</a></aside>' : '')
      : '<p class="empty">Aucun article ne correspond à votre recherche.</p>';

    $('pager').innerHTML = pages > 1 ? Array.apply(null, Array(pages)).map(function (_, i) {
      return '<button class="' + (st.page === i + 1 ? 'on' : '') + '" data-page="' + (i + 1) + '">' + (i + 1) + '</button>';
    }).join('') : '';
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target;
    var c = t.closest('[data-cat]'); if (c) { st.cat = c.getAttribute('data-cat'); st.page = 1; return render(); }
    var g = t.closest('[data-tag]'); if (g) { var v = g.getAttribute('data-tag'); st.tag = st.tag === v ? '' : v; st.page = 1; return render(); }
    var p = t.closest('[data-page]'); if (p) { st.page = +p.getAttribute('data-page'); render(); window.scrollTo({ top: 300, behavior: 'smooth' }); }
  });
  $('sf').addEventListener('submit', function (ev) { ev.preventDefault(); st.q = $('q').value.trim(); st.page = 1; render(); });
  $('q').addEventListener('input', function () { st.q = this.value.trim(); st.page = 1; render(); });

  render();
  if (CMS.qs('id')) {
    $('blog-content').style.display = 'none';
    $('article-placeholder').style.display = 'grid';
  }
})();
</script>
</body>
</html>
