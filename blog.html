<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
/* Si la page casse chez un visiteur, l'erreur s'affiche en bas de l'écran (et dans la console) : une capture suffit pour comprendre */
(function () {
  var CHECK = 'header.hd', errors = [], box = null, done = false;
  function log(msg) {
    errors.push(msg);
    try { console.error('[LYD] ' + msg); } catch (e) {}
    if (done) show();
  }
  window.addEventListener('error', function (ev) {
    var t = ev.target, f = ev.filename || '';
    if (t && t !== window && t.tagName) {
      if (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && /stylesheet/.test(t.rel))) log('Fichier non chargé : ' + (t.src || t.href));
      return;
    }
    if (/^(chrome|moz|safari|safari-web)-extension:/.test(f) || /ResizeObserver loop/.test(ev.message)) return;
    log((ev.message || 'Erreur inconnue') + (f ? ' (' + f.split('/').pop() + ', ligne ' + ev.lineno + ':' + ev.colno + ')' : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (ev) {
    var r = ev.reason;
    log('Opération échouée : ' + (r && r.message ? r.message : String(r)));
  });
  function show() {
    if (!document.body || !errors.length) return;
    if (!box) {
      box = document.createElement('div');
      box.id = 'lyd-err';
      box.setAttribute('aria-live', 'assertive');
      box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483647;max-height:60vh;overflow:auto;background:#fff;color:#111;border:2px solid #b3261e;padding:14px 16px;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;text-align:left;box-shadow:0 8px 30px rgba(0,0,0,.35)';
      document.body.appendChild(box);
    }
    var btn = 'margin:0 8px 0 0;padding:7px 14px;border:1px solid #111;background:#fff;color:#111;font:inherit;cursor:pointer';
    box.style.display = 'block';
    box.innerHTML = '<strong style="color:#b3261e">Une erreur empêche cette page de fonctionner correctement.</strong><br>Faites une capture de ce cadre et envoyez-la à l\'équipe Live Y Dream.' +
      '<pre style="white-space:pre-wrap;word-break:break-word;margin:10px 0;padding:10px;background:#f4f4f4;color:#111;font:12px/1.45 Consolas,Menlo,monospace"></pre>' +
      '<button type="button" style="' + btn + '">Copier le détail</button><button type="button" style="' + btn + '">Fermer</button>';
    var pre = box.querySelector('pre'), b = box.querySelectorAll('button');
    pre.textContent = errors.join('\n') + '\n\nPage : ' + location.href + '\nNavigateur : ' + navigator.userAgent + '\nHeure : ' + new Date().toString();
    b[0].onclick = function () {
      function copied() { b[0].textContent = 'Copié'; }
      function select() {
        var r = document.createRange(), s = window.getSelection();
        r.selectNodeContents(pre); s.removeAllRanges(); s.addRange(r);
        try { if (document.execCommand('copy')) copied(); } catch (e) {}
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(pre.textContent).then(copied, select); else select();
    };
    b[1].onclick = function () { box.style.display = 'none'; };
  }
  /* La page est jugée construite quand CHECK existe et se voit ; sinon on le signale, même sans erreur */
  function check(late) {
    if (done || (!late && window.LYD_WAIT)) return;
    var el = document.querySelector(CHECK), hidden = !!el && !el.getClientRects().length;
    if (late && el && !hidden && !errors.length) return;
    done = true;
    if (!el) log(late ? "Après 20 secondes, la page n'est toujours pas construite (« " + CHECK + ' » absent).' : "La page ne s'est pas construite (« " + CHECK + ' » absent).');
    else if (hidden) log('La page est construite mais cachée (« ' + CHECK + " » masqué). Un bloqueur de publicités en est sans doute la cause : désactivez-le pour ce site.");
    show();
  }
  window.LYD_CHECK = function () { check(false); };
  window.addEventListener('load', function () { setTimeout(function () { check(false); }, 1500); });
  setTimeout(function () { check(true); }, 20000);
})();
</script>
<title>Blog &amp; Ressources - Live Y Dream</title>
<meta name="description" content="Conseils et stratégies de communication pour les marques et PME d'Afrique de l'Ouest.">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div data-lyd="header"></div>

<main>
  <div id="blog-content">
  <section class="dk phero">
    <div class="w">
      <span class="k" data-t="blog.heroK">Blog &amp; Ressources</span>
      <h1 data-t="blog.heroT">Conseils &amp; stratégies pour vos marques</h1>
      <p class="crumb"><a href="index.html">Accueil</a> / Blog</p>
    </div>
  </section>

  <section class="sec" style="padding:60px 0 90px">
    <div class="w">
      <div class="bar">
        <div class="filters" id="cats" style="margin:0"></div>
        <form class="search" id="sf"><input id="q" type="search" placeholder="Rechercher" aria-label="Rechercher un article"><button type="submit">OK</button></form>
      </div>
      <div id="feat"></div>
      <div class="bg" id="grid"></div>
      <div class="pager" id="pager"></div>
    </div>
  </section>

  <section class="gy tagsec">
    <div class="w">
      <h3 data-t="blog.tagsT">Catégories &amp; tags</h3>
      <div class="filters" id="cats2" style="margin:0"></div>
      <div class="tagcloud" id="tags"></div>
    </div>
  </section>
  </div>
  <div id="article-view" style="display:none"></div>
</main>
<div class="rp" id="rp" style="display:none"></div>

<div data-lyd="footer"></div>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/cms.js"></script>
<script>
CMS.ready(function () {
  var e = CMS.esc, $ = function (id) { return document.getElementById(id); };
  var allRaw = CMS.get('articles'), all = CMS.published(allRaw), T = CMS.get('blogTexts');
  var PER = 8;
  var st = { cat: '', tag: '', q: '', page: 1 };

  CMS.mount('blog.html');

  var initials = function (n) { return n.split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase(); };
  var meta = function (a) { return e(a.cat) + ' · ' + e(a.date) + ' · ' + e(a.min) + ' min'; };
  var articleUrl = CMS.articleUrl;

  function filtered() {
    var q = st.q.toLowerCase();
    return all.filter(function (a) {
      return (!st.cat || a.cat === st.cat) &&
        (!st.tag || a.tags.indexOf(st.tag) > -1) &&
        (!q || (a.t + ' ' + a.ex + ' ' + a.tags.join(' ')).toLowerCase().indexOf(q) > -1);
    });
  }

  function footerRow(a) {
    return '<div class="au"><span><i class="av">' + e(initials(a.author)) + '</i>' + e(a.author) + '</span><a href="' + articleUrl(a) + '">Lire l\'article →</a></div>';
  }

  function cats() {
    var names = [];
    all.forEach(function (a) { if (names.indexOf(a.cat) < 0) names.push(a.cat); });
    var html = '<button class="chip' + (!st.cat ? ' on' : '') + '" data-cat="">Tous les articles</button>' +
      names.map(function (n) {
        var c = all.filter(function (a) { return a.cat === n; }).length;
        return '<button class="chip' + (st.cat === n ? ' on' : '') + '" data-cat="' + e(n) + '">' + e(n) + ' · ' + c + '</button>';
      }).join('');
    $('cats').innerHTML = html; $('cats2').innerHTML = html;
  }

  function tags() {
    var seen = {}, list = [];
    all.forEach(function (a) { a.tags.forEach(function (t) { if (!seen[t]) { seen[t] = 1; list.push(t); } }); });
    $('tags').innerHTML = list.map(function (t) {
      return '<button class="' + (st.tag === t ? 'on' : '') + '" data-tag="' + e(t) + '">' + e(t) + '</button>';
    }).join('');
  }

  function render() {
    cats(); tags();
    var list = filtered();
    var feat = list.filter(function (a) { return a.featured; })[0];
    var rest = list.filter(function (a) { return a !== feat; });
    var pages = Math.max(1, Math.ceil(rest.length / PER));
    if (st.page > pages) st.page = pages;

    $('feat').innerHTML = feat && st.page === 1 ?
      '<article class="feat"><div class="im ph-box">' + CMS.ph(feat.img, 'À la une', feat.t) + '</div><div>' +
      '<span class="pill">À LA UNE</span><p class="meta" style="display:inline;margin-left:10px">' + meta(feat) + '</p>' +
      '<h2>' + e(feat.t) + '</h2><p class="ex">' + e(feat.ex) + '</p>' + footerRow(feat) + '</div></article>' : '';

    var slice = rest.slice((st.page - 1) * PER, st.page * PER);
    $('grid').innerHTML = slice.length || feat ? slice.map(function (a) {
      return '<article class="ar"><div class="im ph-box">' + CMS.ph(a.img, a.cat, a.t) + '</div>' +
        '<p class="meta">' + meta(a) + '</p><h3><a href="' + articleUrl(a) + '">' + e(a.t) + '</a></h3><p class="ex">' + e(a.ex) + '</p>' + footerRow(a) + '</article>';
    }).join('') + (st.page === pages ? '<aside class="audit"><h3>' + e(T.auditT) + '</h3><p>' + e(T.auditD) + '</p><a class="btn" href="contact.html?service=' + encodeURIComponent('Stratégie Digitale Complète') + '">' + e(T.auditBtn) + '</a></aside>' : '')
      : '<p class="empty">Aucun article ne correspond à votre recherche.</p>';

    $('pager').innerHTML = pages > 1 ? Array.apply(null, Array(pages)).map(function (_, i) {
      return '<button class="' + (st.page === i + 1 ? 'on' : '') + '" data-page="' + (i + 1) + '">' + (i + 1) + '</button>';
    }).join('') : '';
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target;
    var c = t.closest('[data-cat]'); if (c) { st.cat = c.getAttribute('data-cat'); st.page = 1; return render(); }
    var g = t.closest('[data-tag]'); if (g) { var v = g.getAttribute('data-tag'); st.tag = st.tag === v ? '' : v; st.page = 1; return render(); }
    var p = t.closest('[data-page]'); if (p) { st.page = +p.getAttribute('data-page'); render(); window.scrollTo({ top: 300, behavior: 'smooth' }); }
  });
  $('sf').addEventListener('submit', function (ev) { ev.preventDefault(); st.q = $('q').value.trim(); st.page = 1; render(); });
  $('q').addEventListener('input', function () { st.q = this.value.trim(); st.page = 1; render(); });

  /* ---------- Page article ---------- */

  /* ---------- Commentaires ---------- */
  function commentsHtml(a, extra) {
    var data = CMS.commentThreads(a.id, extra), open = CMS.get('discussion').enabled && a.allowComments !== false;
    if (!data.total && !open) return '';
    function when(d) { return new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); }
    function one(c, isReply) {
      return '<div class="cm' + (isReply ? ' reply' : '') + '" id="c-' + e(c.id) + '"><i class="av">' + e(initials(c.author)) + '</i><div class="cm-b">' +
        '<b>' + e(c.author) + '</b><span class="cm-d">' + e(when(c.date)) + '</span><p>' + e(c.content) + '</p>' +
        (open && !isReply ? '<button type="button" class="cm-r" data-reply="' + e(c.id) + '" data-name="' + e(c.author) + '">Répondre</button>' : '') + '</div></div>';
    }
    var moderate = CMS.get('discussion').moderate !== false;
    return '<section class="cmts" id="commentaires">' +
      (data.total ? '<h2>' + data.total + (data.total > 1 ? ' commentaires' : ' commentaire') + '</h2>' : '') +
      data.threads.map(function (t) { return one(t.c) + t.replies.map(function (r) { return one(r, true); }).join(''); }).join('') +
      (open ? '<form class="fm cm-form" id="cm-form" novalidate><h3>Laisser un commentaire</h3>' +
        '<p class="sb">Votre email ne sera pas publié.' + (moderate ? ' Les commentaires sont relus avant de paraître.' : '') + '</p>' +
        '<p class="cm-to" id="cm-to" hidden></p>' +
        '<div class="fg"><div><label for="cm-name">Nom *</label><input id="cm-name" name="author" required maxlength="120" autocomplete="name"></div>' +
        '<div><label for="cm-mail">Email *</label><input id="cm-mail" name="email" type="email" required maxlength="254" autocomplete="email"></div>' +
        '<div class="full"><label for="cm-text">Commentaire *</label><textarea id="cm-text" name="content" required maxlength="5000"></textarea></div></div>' +
        '<p class="err" id="cm-err" role="alert"></p>' +
        '<input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">' +
        '<button class="btn b" type="submit">Publier le commentaire</button><p class="ok" id="cm-ok" role="status"></p></form>' : '') +
      '</section>';
  }
  function wireComments(a) {
    var form = $('cm-form');
    if (!form) return;
    var parent = '', to = $('cm-to');
    function setParent(id, name) {
      parent = id;
      to.hidden = !id;
      to.textContent = '';
      if (!id) return;
      to.appendChild(document.createTextNode('Réponse à ' + name + ' '));
      var cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.textContent = 'Annuler';
      cancel.addEventListener('click', function () { setParent('', ''); });
      to.appendChild(cancel);
    }
    document.querySelectorAll('[data-reply]').forEach(function (b) {
      b.addEventListener('click', function () {
        setParent(b.getAttribute('data-reply'), b.getAttribute('data-name'));
        form.scrollIntoView({ block: 'center' });
        $('cm-text').focus();
      });
    });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var v = function (n) { return form.elements[n].value.trim(); }, err = $('cm-err'), ok = $('cm-ok');
      err.style.display = 'none';
      ok.style.display = 'none';
      if (v('_honey')) { ok.textContent = 'Merci, votre commentaire sera publié après relecture.'; ok.style.display = 'block'; form.reset(); return; }
      if (!v('author') || !v('email') || !v('content')) { err.textContent = 'Merci de renseigner votre nom, votre email et votre commentaire.'; err.style.display = 'block'; return; }
      if (!/^\S+@\S+\.\S+$/.test(v('email'))) { err.textContent = 'Cette adresse email ne semble pas valide.'; err.style.display = 'block'; return; }
      var send = form.querySelector('button[type="submit"]');
      send.disabled = true;
      CMS.postComment({ article: a.id, parent: parent, author: v('author'), email: v('email'), content: v('content') }).then(function (r) {
        send.disabled = false;
        form.reset();
        setParent('', '');
        if (r.status === 'approved') { loadComments(a, 'Merci, votre commentaire est publié.'); return; }
        ok.textContent = 'Merci, votre commentaire sera publié après relecture.';
        ok.style.display = 'block';
      }, function (x) {
        send.disabled = false;
        err.textContent = x.code === 'closed' ? x.message : "Votre commentaire n'a pas pu être envoyé. " + x.message;
        err.style.display = 'block';
      });
    });
  }
  /* Commentaires approuvés de la base : la section est redessinée, la saisie en cours est gardée */
  function loadComments(a, notice) {
    CMS.loadComments(a.id).then(function (list) {
      var sec = $('commentaires');
      if (!sec || (!list.length && !notice)) return;
      var keep = {};
      ['cm-name', 'cm-mail', 'cm-text'].forEach(function (id) { if ($(id)) keep[id] = $(id).value; });
      var tmp = document.createElement('div');
      tmp.innerHTML = commentsHtml(a, list);
      if (!tmp.firstChild) return;
      sec.parentNode.replaceChild(tmp.firstChild, sec);
      Object.keys(keep).forEach(function (id) { if ($(id)) $(id).value = keep[id]; });
      wireComments(a);
      if (notice && $('cm-ok')) { $('cm-ok').textContent = notice; $('cm-ok').style.display = 'block'; }
      var target = /^#c-[\w-]+$/.test(location.hash) && document.querySelector(location.hash);
      if (target) target.scrollIntoView();
    }, function (e) {
      try { console.error('[LYD] Commentaires non chargés : ' + e.message); } catch (x) {}
    });
  }

  function related(a) {
    var others = all.filter(function (x) { return x.id !== a.id; });
    others.sort(function (x, y) {
      var sx = x.tags.filter(function (t) { return a.tags.indexOf(t) > -1; }).length;
      var sy = y.tags.filter(function (t) { return a.tags.indexOf(t) > -1; }).length;
      return sy - sx;
    });
    return others.slice(0, 3);
  }

  function renderArticle(id) {
    /* ?preview=1 : aperçu d'un brouillon depuis l'admin, dans le navigateur de l'auteur */
    var a = (CMS.isPreview() ? allRaw : all).filter(function (x) { return x.id === id || CMS.articleSlug(x.id) === id; })[0];
    var view = $('article-view');
    $('blog-content').style.display = 'none';
    view.style.display = 'block';

    if (!a) {
      view.innerHTML = '<section class="dk phero"><div class="w"><p class="crumb" style="margin:0"><a href="index.html">Accueil</a> / <a href="blog.html">Blog</a></p></div></section>' +
        '<section class="anf"><div class="w"><h1>Article introuvable</h1><p class="mu" style="margin-bottom:24px">Cet article n\'existe pas ou a été déplacé.</p><a class="btn b" href="blog.html">Retour au blog</a></div></section>';
      document.title = 'Article introuvable - Live Y Dream';
      return;
    }

    /* Google affiche environ 60 caractères de titre et 155 de description */
    document.title = a.seoT || (a.t.length <= 45 ? a.t + ' - Live Y Dream' : a.t);
    var shortText = function (t, n) { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length <= n ? t : t.slice(0, n - 1).replace(/\s+\S*$/, '') + '…'; };
    var md = document.querySelector('meta[name="description"]'); if (md) md.setAttribute('content', a.seoD || shortText(a.ex, 155));
    /* Adresse de référence pour Google et pour le partage : la page de l'article */
    var canon = document.querySelector('link[rel="canonical"]');
    if (canon) canon.setAttribute('href', new URL(canon.href).origin + '/blog/' + CMS.articleSlug(a.id) + '/');

    var b = CMS.articleHtml(a);
    var url = canon ? canon.href : location.href.split('#')[0];
    var enc = encodeURIComponent;
    var wa = CMS.get('settings').whatsapp;

    view.innerHTML =
      '<section class="dk ahero"><div class="w">' +
        '<p class="crumb"><a href="index.html">Accueil</a> / <a href="blog.html">Blog</a> / ' + e(a.cat) + '</p>' +
        '<span class="pill">' + e(a.cat).toUpperCase() + '</span>' +
        '<h1>' + e(a.t) + '</h1>' +
        '<div class="ameta"><span class="who"><i class="av">' + e(initials(a.author)) + '</i>' + e(a.author) + '</span><span>' + e(a.date) + '</span><span>' + e(a.min) + ' min de lecture</span></div>' +
      '</div></section>' +

      '<div class="w"><div class="acover ph-box">' + CMS.ph(a.img, a.cat, a.t) + '</div>' +
      '<div class="abody"><article>' +
        '<div class="prose">' + b.html + '</div>' +
      '</article>' +
      '<aside class="aside">' +
        (b.toc.length ? '<div class="box"><h5>Dans cet article</h5><nav class="toc" id="toc">' + b.toc.map(function (t) { return '<a href="#' + e(t[0]) + '"' + (t[2] ? ' class="sub"' : '') + '>' + e(t[1]) + '</a>'; }).join('') + '</nav></div>' : '') +
        '<div class="box"><h5>Partager</h5><div class="share">' +
          '<a href="https://wa.me/?text=' + enc(a.t + ' ' + url) + '" target="_blank" rel="noopener">WhatsApp</a>' +
          '<a href="https://www.facebook.com/sharer/sharer.php?u=' + enc(url) + '" target="_blank" rel="noopener">Facebook</a>' +
          '<a href="https://www.linkedin.com/sharing/share-offsite/?url=' + enc(url) + '" target="_blank" rel="noopener">LinkedIn</a>' +
          '<button type="button" id="copy">Copier le lien</button></div></div>' +
        '<div class="audit"><h3>' + e(T.auditT) + '</h3><p>' + e(T.auditD) + '</p><a class="btn" href="contact.html?service=' + enc('Stratégie Digitale Complète') + '">' + e(T.auditBtn) + '</a></div>' +
      '</aside></div>' +

      '<div class="atags">' + a.tags.map(function (t) { return '<a href="blog.html?tag=' + enc(t) + '">' + e(t) + '</a>'; }).join('') + '</div>' +
      '<div class="abox"><i class="av">' + e(initials(a.author)) + '</i><div><b>' + e(a.author) + '</b><p>' + e(T.bio) + '</p></div></div>' + commentsHtml(a) + '</div>' +

      '<section class="gy rel"><div class="w"><p class="k">À lire aussi</p>' +
        '<div class="rel-h"><h2 class="h2">Continuez votre lecture</h2><a class="btn ob" href="blog.html">Tous les articles</a></div>' +
        '<div class="bg">' + related(a).map(function (r) {
          return '<article class="ar"><div class="im ph-box">' + CMS.ph(r.img, r.cat, r.t) + '</div><p class="meta">' + meta(r) + '</p>' +
            '<h3><a href="' + articleUrl(r) + '">' + e(r.t) + '</a></h3><p class="ex">' + e(r.ex) + '</p>' + footerRow(r) + '</article>';
        }).join('') + '</div></div></section>' +

      '<section class="cta-s dk"><div class="w"><p class="k">' + e(T.ctaK) + '</p>' +
        '<h2 style="font-size:clamp(32px,5vw,64px)">' + e(T.ctaT) + '</h2>' +
        '<p class="t mu">' + e(T.ctaD) + '</p>' +
        '<div class="actions"><a class="btn" href="contact.html">' + e(T.ctaBtn) + '</a><a class="btn o" href="' + e(wa) + '" target="_blank" rel="noopener">' + e(T.ctaWa) + '</a></div></div></section>';

    wireComments(a);
    loadComments(a);
    if (location.hash.indexOf('#c-') === 0 && document.getElementById(location.hash.slice(1))) document.getElementById(location.hash.slice(1)).scrollIntoView();
    else window.scrollTo(0, 0);

    var copy = $('copy');
    if (copy) copy.addEventListener('click', function () {
      var done = function () { copy.textContent = 'Lien copié ✓'; setTimeout(function () { copy.textContent = 'Copier le lien'; }, 2000); };
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, done); else done();
    });

    /* Barre de progression + sommaire actif */
    var rp = $('rp'); rp.style.display = 'block';
    var heads = [].slice.call(view.querySelectorAll('.prose h2,.prose h3')), links = [].slice.call(view.querySelectorAll('#toc a'));
    function onScroll() {
      var h = document.documentElement;
      rp.style.width = Math.min(100, (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight)) * 100) + '%';
      var cur = -1; heads.forEach(function (x, i) { if (x.getBoundingClientRect().top < 140) cur = i; });
      links.forEach(function (l, i) { l.classList.toggle('on', i === cur); });
    }
    window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
  }

  render();
  /* Arrivée depuis une page d'article avec un tag : ?tag=… filtre la liste */
  if (CMS.qs('tag')) { st.tag = CMS.qs('tag'); render(); }
  var wanted = CMS.qs('id') || CMS.pathId('blog');
  if (wanted) renderArticle(wanted);
});
</script>
</body>
</html>
